# tpmix: split the Topping E4X4 Pro Audio channels into named stereo devices.
# Requires the "Pro Audio" profile on the E4X4 card.
# Capture  alsa_input.usb-Topping_E4x4_Pre-00.pro-input-0  (AUX0..AUX9):
#   AUX0-3 = IN1-4, AUX4-9 = Loopback 1-6  -> sources "E4x4 Loopback 1+2/3+4/5+6"
# Playback alsa_output.usb-Topping_E4x4_Pre-00.pro-output-0 (AUX0..AUX7):
#   AUX0-7 = Playback 1-8                  -> sinks "E4x4 Playback 1/2, 3/4, 5/6, 7/8"
context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "E4x4 Loopback 1+2"
            capture.props = {
                node.name         = "tpmix.e4x4.loopback12.capture"
                audio.position    = [ AUX4 AUX5 ]
                stream.dont-remix = true
                target.object     = "alsa_input.usb-Topping_E4x4_Pre-00.pro-input-0"
                node.passive      = true
            }
            playback.props = {
                node.name      = "tpmix.e4x4.loopback12"
                media.class    = "Audio/Source"
                audio.position = [ FL FR ]
            }
        }
    }
    {   name = libpipewire-module-loopback
        args = {
            node.description = "E4x4 Loopback 3+4"
            capture.props = {
                node.name         = "tpmix.e4x4.loopback34.capture"
                audio.position    = [ AUX6 AUX7 ]
                stream.dont-remix = true
                target.object     = "alsa_input.usb-Topping_E4x4_Pre-00.pro-input-0"
                node.passive      = true
            }
            playback.props = {
                node.name      = "tpmix.e4x4.loopback34"
                media.class    = "Audio/Source"
                audio.position = [ FL FR ]
            }
        }
    }
    {   name = libpipewire-module-loopback
        args = {
            node.description = "E4x4 Loopback 5+6"
            capture.props = {
                node.name         = "tpmix.e4x4.loopback56.capture"
                audio.position    = [ AUX8 AUX9 ]
                stream.dont-remix = true
                target.object     = "alsa_input.usb-Topping_E4x4_Pre-00.pro-input-0"
                node.passive      = true
            }
            playback.props = {
                node.name      = "tpmix.e4x4.loopback56"
                media.class    = "Audio/Source"
                audio.position = [ FL FR ]
            }
        }
    }
    {   name = libpipewire-module-loopback
        args = {
            node.description = "E4x4 Playback 1/2"
            capture.props = {
                node.name      = "tpmix.e4x4.playback12"
                media.class    = "Audio/Sink"
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name         = "tpmix.e4x4.playback12.output"
                audio.position    = [ AUX0 AUX1 ]
                stream.dont-remix = true
                target.object     = "alsa_output.usb-Topping_E4x4_Pre-00.pro-output-0"
                node.passive      = true
            }
        }
    }
    {   name = libpipewire-module-loopback
        args = {
            node.description = "E4x4 Playback 3/4"
            capture.props = {
                node.name      = "tpmix.e4x4.playback34"
                media.class    = "Audio/Sink"
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name         = "tpmix.e4x4.playback34.output"
                audio.position    = [ AUX2 AUX3 ]
                stream.dont-remix = true
                target.object     = "alsa_output.usb-Topping_E4x4_Pre-00.pro-output-0"
                node.passive      = true
            }
        }
    }
    {   name = libpipewire-module-loopback
        args = {
            node.description = "E4x4 Playback 5/6"
            capture.props = {
                node.name      = "tpmix.e4x4.playback56"
                media.class    = "Audio/Sink"
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name         = "tpmix.e4x4.playback56.output"
                audio.position    = [ AUX4 AUX5 ]
                stream.dont-remix = true
                target.object     = "alsa_output.usb-Topping_E4x4_Pre-00.pro-output-0"
                node.passive      = true
            }
        }
    }
    {   name = libpipewire-module-loopback
        args = {
            node.description = "E4x4 Playback 7/8"
            capture.props = {
                node.name      = "tpmix.e4x4.playback78"
                media.class    = "Audio/Sink"
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name         = "tpmix.e4x4.playback78.output"
                audio.position    = [ AUX6 AUX7 ]
                stream.dont-remix = true
                target.object     = "alsa_output.usb-Topping_E4x4_Pre-00.pro-output-0"
                node.passive      = true
            }
        }
    }
]
