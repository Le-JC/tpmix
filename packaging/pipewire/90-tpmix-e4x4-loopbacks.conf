# tpmix: expose the Topping E4X4 loopback channels as stereo sources.
# Requires the "Pro Audio" profile on the E4X4 card (10-channel source
# alsa_input.usb-Topping_E4x4_Pre-00.pro-input-0, channels AUX0..AUX9:
# AUX0-3 = IN1-4, AUX4-9 = Loopback 1-6).
context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "E4x4 Loopback 1+2"
            capture.props = {
                node.name         = "tpmix.e4x4.loopback12.capture"
                audio.position    = [ AUX4 AUX5 ]
                stream.dont-remix = true
                target.object     = "alsa_input.usb-Topping_E4x4_Pre-00.pro-input-0"
                node.passive      = true
            }
            playback.props = {
                node.name      = "tpmix.e4x4.loopback12"
                media.class    = "Audio/Source"
                audio.position = [ FL FR ]
            }
        }
    }
    {   name = libpipewire-module-loopback
        args = {
            node.description = "E4x4 Loopback 3+4"
            capture.props = {
                node.name         = "tpmix.e4x4.loopback34.capture"
                audio.position    = [ AUX6 AUX7 ]
                stream.dont-remix = true
                target.object     = "alsa_input.usb-Topping_E4x4_Pre-00.pro-input-0"
                node.passive      = true
            }
            playback.props = {
                node.name      = "tpmix.e4x4.loopback34"
                media.class    = "Audio/Source"
                audio.position = [ FL FR ]
            }
        }
    }
    {   name = libpipewire-module-loopback
        args = {
            node.description = "E4x4 Loopback 5+6"
            capture.props = {
                node.name         = "tpmix.e4x4.loopback56.capture"
                audio.position    = [ AUX8 AUX9 ]
                stream.dont-remix = true
                target.object     = "alsa_input.usb-Topping_E4x4_Pre-00.pro-input-0"
                node.passive      = true
            }
            playback.props = {
                node.name      = "tpmix.e4x4.loopback56"
                media.class    = "Audio/Source"
                audio.position = [ FL FR ]
            }
        }
    }
]
